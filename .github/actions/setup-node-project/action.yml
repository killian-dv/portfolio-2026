name: Setup Node project
description: Install dependencies with npm cache and skip Husky in CI

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
      env:
        HUSKY: "0"
